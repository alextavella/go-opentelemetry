receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 'otel-collector:4317'
      http:
        endpoint: 'otel-collector:4318'

exporters:
  jaeger:
    endpoint: jaeger:14250
    tls:
      insecure: true
  zipkin:
    endpoint: 'http://zipkin:9411/api/v2/spans'
  prometheus:
    endpoint: '0.0.0.0:8889'

processors:
  batch:

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [zipkin, jaeger]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
